name: CI with SQL Server

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      # SA password should be provided as a repository secret named `SA_PASSWORD`.
      SA_PASSWORD: ${{ secrets.SA_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SA_PASSWORD
        id: prepare-sa
        run: |
          # If the repository secret is not provided, use a CI-only fallback so integration steps still run.
          if [ -z "${{ secrets.SA_PASSWORD }}" ]; then
            echo "Warning: Repository secret 'SA_PASSWORD' is not set. Using fallback password 'Your_password123!' for CI run. Set the secret to enable secure integration testing." >&2
            echo "SA_PASSWORD=Your_password123!" >> $GITHUB_ENV
          else
            echo "SA_PASSWORD=${{ secrets.SA_PASSWORD }}" >> $GITHUB_ENV
          fi
          echo "SA_PRESENT=true" >> $GITHUB_ENV

      - name: Start SQL Server container
        run: |
          # Start container with a healthcheck that looks for the readiness message in the SQL Server error log.
          docker run -e 'ACCEPT_EULA=Y' -e "SA_PASSWORD=$SA_PASSWORD" -p 1433:1433 \
            --name sqlserver-ci -d \
            --health-cmd "bash -c 'grep -q \"SQL Server is now ready for client connections\" /var/opt/mssql/log/errorlog || exit 1'" \
            --health-interval=10s --health-retries=30 \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Install sqlcmd (mssql-tools)
        if: env.SA_PRESENT == 'true'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y curl apt-transport-https ca-certificates gnupg
          # Add Microsoft package signing key and repository for Ubuntu 22.04
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          # Install ODBC driver and mssql-tools
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools unixodbc-dev
          # Add mssql-tools to PATH for following steps
          echo "PATH=/opt/mssql-tools/bin:$PATH" >> $GITHUB_ENV

      - name: Wait for SQL Server to be healthy
        if: env.SA_PRESENT == 'true'
        run: |
          set -eux
          attempts=0
          # Wait for container health status to become 'healthy'
          while [ $attempts -lt 60 ]; do
            status=$(docker inspect --format='{{.State.Health.Status}}' sqlserver-ci 2>/dev/null || echo "unknown")
            echo "Container health status: $status"
            if [ "$status" = "healthy" ]; then
              echo "Container reports healthy"
              break
            fi
            attempts=$((attempts+1))
            sleep 5
          done

          if [ "$status" != "healthy" ]; then
            echo "ERROR: SQL Server container did not report healthy status" >&2
            echo "---- Recent SQL Server logs (tail 200) ----" >&2
            docker logs --tail 200 sqlserver-ci >&2 || true
            exit 1
          fi

          # Final connectivity check from runner
          if ! /opt/mssql-tools/bin/sqlcmd -S tcp:127.0.0.1,1433 -U sa -P "$SA_PASSWORD" -Q "SELECT 1" -l 5; then
            echo "ERROR: sqlcmd could not connect even though container is healthy" >&2
            docker logs --tail 200 sqlserver-ci >&2 || true
            exit 1
          fi

      - name: Create database
        if: env.SA_PRESENT == 'true'
        run: |
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -Q "IF DB_ID('EcommerceAiDb') IS NULL CREATE DATABASE EcommerceAiDb"

      - name: Install dotnet-ef tool
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          echo "PATH=$PATH:$HOME/.dotnet/tools" >> $GITHUB_ENV

      - name: Restore
        run: dotnet restore EcommerceAiAssistant/EcommerceAiAssistant.csproj

      - name: Apply EF Core migrations
        if: env.SA_PRESENT == 'true'
        run: |
          set -o pipefail
          # Build a connection string using the SA_PASSWORD provided to the job.
          CONN="Server=127.0.0.1,1433;Database=EcommerceAiDb;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True"

          echo "Using connection: Server=127.0.0.1,1433;Database=EcommerceAiDb;User Id=sa;Password=***REDACTED***;TrustServerCertificate=True"

          dotnet ef database update --project EcommerceAiAssistant/EcommerceAiAssistant.csproj --startup-project EcommerceAiAssistant/EcommerceAiAssistant.csproj --connection "$CONN" || (
            echo "dotnet ef failed. Dumping SQL Server container logs for diagnosis:" >&2
            cid=$(docker ps --filter name=sqlserver-ci -q | head -n1)
            if [ -n "$cid" ]; then
              docker logs --tail 200 "$cid" >&2
            else
              echo "SQL Server container not found via docker ps" >&2
            fi
            exit 1
          )

      - name: Build
        run: dotnet build --configuration Release --no-restore EcommerceAiAssistant/EcommerceAiAssistant.csproj

      - name: Run API (background)
        if: env.SA_PRESENT == 'true'
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=EcommerceAiDb;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True"
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          # Start the API explicitly binding to 0.0.0.0:5000 so the runner can reach it
          dotnet run --project EcommerceAiAssistant --no-build --urls "http://0.0.0.0:5000" &
          echo "Started API, waiting for it to come up..."
          for i in {1..30}; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/swagger/index.html || true)
            echo "Attempt $i - HTTP status: $status"
            if [ "$status" = "200" ]; then
              echo "API is up"
              break
            fi
            sleep 3
          done

      - name: Smoke test
        if: env.SA_PRESENT == 'true'
        run: |
          curl -fS http://localhost:5000/swagger/index.html

      - name: Publish artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: published-artifacts
          path: |
            EcommerceAiAssistant/bin/Release
